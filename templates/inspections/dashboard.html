{% load static %}<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ dashboard.heading }}</title>
  <link rel="stylesheet" href="{% static 'inspections/vendor/maplibre-gl.css' %}">
  <link rel="stylesheet" href="{% static 'inspections/dashboard/dashboard.css' %}">
  <style>
    body { margin: 0; background: #fbfaf8;
           font: 16px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    .page { max-width: 1280px; margin: 0 auto; padding: 24px 20px 60px; }
  </style>
</head>
<body>
  <div class="page"><div class="arhi-mount"></div></div>
  {# json_script escapes </script> and friends, which |safe would not. #}
  {{ config|json_script:"arhi-config" }}
  <script type="module">
    import { mountDashboard } from "{% static 'inspections/dashboard/dashboard.js' %}";
    const config = JSON.parse(document.getElementById("arhi-config").textContent);
    mountDashboard(document.querySelector(".arhi-mount"), config);
  </script>
</body>
</html>
