<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<title>{{ embed.heading }}</title>
<style>html,body{margin:0;padding:0;background:transparent}</style>
</head>

     error page so a live article degrades to empty space. -->

</body></html>
